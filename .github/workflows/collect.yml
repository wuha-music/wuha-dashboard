name: Zahlen sammeln

on:
  schedule:
    - cron: "15 5 * * *"   # t√§glich ca. 06:15 Uhr Wiener Zeit (Winter)
  workflow_dispatch:        # manuell starten: Actions ‚Üí "Zahlen sammeln" ‚Üí Run workflow
  push:
    paths:
      - "data/imports/**"   # neue CSV hochgeladen ‚Üí sofort einlesen

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten abrufen
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python collect.py

      - name: Neuen TikTok-Token speichern
        if: hashFiles('.new_tiktok_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < .new_tiktok_refresh_token
          else
            echo "::warning::TikTok hat einen neuen Refresh-Token ausgegeben, aber GH_PAT fehlt."
          fi
          rm -f .new_tiktok_refresh_token

      - name: Speichern
        run: |
          git config user.name "wuha-bot"
          git config user.email "wuha-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Daten $(date -u +%F)"
          git pull --rebase origin main
