name: Playlists prüfen

on:
  schedule:
    - cron: "23 4 * * *"   # 05:23 Wien (Winterzeit)
    - cron: "23 3 * * *"   # 05:23 Wien (Sommerzeit)
  workflow_dispatch:        # manuell: Actions -> "Playlists prüfen" -> Run workflow
  push:
    paths:
      - "data/imports/playlists_manuell.csv"
      - "playlist_watch.py"

permissions:
  contents: write

concurrency:
  group: playlists
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Richtige Uhrzeit? (nur 05:23 Wien)
        id: gate
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          off=$(TZ=Europe/Vienna date +%z)
          if [ -z "$SCHED" ] || { [ "$off" = "+0100" ] && [ "$SCHED" = "23 4 * * *" ]; } || { [ "$off" = "+0200" ] && [ "$SCHED" = "23 3 * * *" ]; }; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "Andere Jahreszeit – übersprungen."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"

      - name: Mails lesen + Playlisten prüfen
        if: steps.gate.outputs.run == 'yes'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python playlist_watch.py

      - name: Speichern
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "wuha-bot"
          git config user.email "wuha-bot@users.noreply.github.com"
          git add data/playlists_found.json
          git commit -m "Playlists $(TZ=Europe/Vienna date +%F)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
